services:
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      GITHUB_REPOSITORY_URL: ${GITHUB_REPOSITORY_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - chroma-data:/data/chroma
      - huggingface-cache:/home/app/.cache/huggingface
  cloudflared:
    image: cloudflare/cloudflared:2026.7.3
    command: tunnel --no-autoupdate --protocol http2 --url http://web:8000
    depends_on:
      - web
    profiles: ["public"]
volumes:
  chroma-data:
  huggingface-cache:
